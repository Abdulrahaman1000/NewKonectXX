<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Pick light or dark before the page paints, so there is no flash.
      (function () {
        try {
          var c = localStorage.getItem('sc-theme');
          var t = c === 'light' || c === 'dark' ? c
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          if (location.pathname.indexOf('/admin') === 0) t = 'dark';
          var d = document.documentElement;
          d.classList.add(t);
          d.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#FBF8F1' : '#0a0a0f');
        } catch (e) {}
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Default fallback meta — react-helmet-async overrides per page -->
    <title>Smart Combo — Premium Lifestyle Gadgets in Nigeria</title>
    <meta
      name="description"
      content="Smart Watch, Audio Glasses, and Premium Bracelet — three premium pieces, one unbeatable price. Free nationwide delivery in Nigeria."
    />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Smart Combo" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:title" content="Smart Combo — Premium Lifestyle Gadgets" />
    <meta
      property="og:description"
      content="Three premium pieces, one unbeatable price. Free nationwide delivery."
    />
    <meta property="og:image" content="https://smartcombo.com.ng/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://smartcombo.com.ng/og-image.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
